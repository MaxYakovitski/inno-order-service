services:
  order-service:
    build: .
    container_name: order-service-app
    ports:
      - "${APP_PORT}:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
    depends_on:
      order-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - inno-net
      - order-internal

  order-postgres:
    image: postgres:16
    container_name: order-service-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - order-internal

  redis:
    image: redis:7
    container_name: order-service-redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - order-internal

volumes:
  postgres_data:
  redis_data:

networks:
  inno-net:
    external: true
  order-internal:
    driver: bridge