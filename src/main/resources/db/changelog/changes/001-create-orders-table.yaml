databaseChangeLog:
  - changeSet:
      id: 001-create-orders-table
      author: ma_yak
      changes:
        - createTable:
            tableName: orders
            columns:
              - column: { name: version, type: BIGINT, constraints: { nullable: false } }
              - column: { name: id, type: UUID, constraints: { primaryKey: true, nullable: false } }
              - column: { name: user_id, type: UUID, constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR (25), constraints: { nullable: false } }
              - column: { name: total_price, type: "NUMERIC (12,2)", constraints: { nullable: false} }
              - column: { name: deleted, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMPTZ, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMPTZ, constraints: { nullable: false } }
        - createIndex:
            tableName: orders
            indexName: idx_orders_user_id
            columns:
              - column:
                  name: user_id
        - createIndex:
            tableName: orders
            indexName: idx_orders_status
            columns:
              - column:
                  name: status
        - sql:
            sql: CREATE INDEX idx_orders_user_not_deleted ON orders (user_id) WHERE deleted = false;

  - changeSet:
      id: 001-orders-total-price-check
      author: ma_yak
      changes:
        - sql:
            sql: ALTER TABLE orders ADD CONSTRAINT ck_orders_total_price CHECK (total_price > 0)
      rollback:
        - sql:
            sql: ALTER TABLE orders DROP CONSTRAINT ck_orders_total_price