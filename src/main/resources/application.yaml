spring:
  application:
    name: order-service

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:9000/.well-known/jwks.json}

user-service:
  base-url: ${USER_SERVICE_URL:http://localhost:8080}
  timeout-ms: 5000

server:
  port: ${SERVER_PORT:8082}